<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinehouse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div class="container nav">
                <div class="brand">
                    <span class="brand-mark"></span>
                    <div>
                        <p class="eyebrow">Catálogo</p>
                        <h1>Cinehouse</h1>
                    </div>
                </div>

                <a href="./cadastrar/cadastrar.html" class="primary-button">Cadastrar filme</a>
            </div>
        </header>

        <main class="container main-content">
            <section class="hero-panel">
                <div class="hero-copy">
                    <p class="section-kicker">Biblioteca</p>

                    <p>Uma vitrine com filmes, gêneros e detalhes essenciais para organizar sua coleção.</p>
                </div>
            </section>

            <section class="movie-grid" id="movieGrid" aria-live="polite"></section>
        </main>
    </div>

    <script src="script.js"></script>
